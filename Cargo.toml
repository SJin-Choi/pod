[workspace]
resolver = "3"
members = ["crates/pod-spike", "crates/podd", "crates/pod-cli", "crates/pod-status", "crates/pod-hook", "crates/pod-terminal-view", "crates/pod-app", "crates/diff-spike", "crates/pod-ui", "crates/pod-diff", "crates/pod-editor"]

[patch.crates-io]
# Apache-2.0 toolkit; accessibility fixes are recorded in vendor/gpui-component/POD-PATCHES.md.
gpui-component = { path = "vendor/gpui-component" }

[workspace.package]
# Pod release version: the installer and portable zip are named after it
# (tools/installer/build.ps1). Crates keep their own versions.
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[profile.release]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

# Opt-in per crate with `[lints] workspace = true` (pod-spike is left as is).
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "allow"
