# cargo-deny policy for the Pod workspace (Apache-2.0 project).
#   cargo deny check
#
# Licenses: only permissive licenses compatible with Apache-2.0/MIT
# distribution. No GPL / AGPL / LGPL (not listed => denied). Copyleft of any
# strength needs an explicit, reviewed per-crate exception below.

[graph]
targets = [{ triple = "x86_64-pc-windows-msvc" }]
all-features = false

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
]
exceptions = [
    # Weak copyleft (file-level). Reached only through pod-spike's UI stack
    # (gpui-kit-assets -> rust-embed -> shellexpand -> dirs -> dirs-sys) and
    # used unmodified, which MPL-2.0 permits in an Apache-2.0 work. Revisit
    # when the UI crate is productized.
    { crate = "option-ext", allow = ["MPL-2.0"] },
]

[licenses.private]
# Our own crates are `publish = false`; they are Apache-2.0 via the workspace.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
version = 2
yanked = "warn"
# Vulnerabilities fail at any depth. "Unmaintained" notices fail only for
# crates the workspace depends on directly; transitive ones are not reported.
# Under `unmaintained = "all"` (2026-11-08) four transitive notices appear:
# instant (RUSTSEC-2024-0384), paste (RUSTSEC-2024-0436), rustybuzz
# (RUSTSEC-2026-0206), ttf-parser (RUSTSEC-2026-0192), all only via
# pod-spike's GPUI stack (gpui-kit / gpui-pre), none via podd or pod-cli.
unmaintained = "workspace"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
