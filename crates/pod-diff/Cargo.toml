[package]
name = "pod-diff"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Review diff model shared by pod-app and diff-spike: full-context patches, git/task loading, gpui-component Diff adapter"

[dependencies]
# gpui-component's Diff highlights with tree-sitter when the grammar features
# are on; enabling them here turns highlighting on for every user of pod-diff.
gpui-kit = { version = "0.9.0", features = [
    "tree-sitter-rust",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-python",
    "tree-sitter-toml",
    "tree-sitter-markdown",
] }
# MIT/Apache-2.0: line diff
similar = "2"
anyhow = "1"

[lints]
workspace = true
