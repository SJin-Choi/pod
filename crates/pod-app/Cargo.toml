[package]
name = "pod-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Pod desktop app (P2 UI MVP): GPUI client of the podd daemon"

[[bin]]
name = "pod-app"
path = "src/main.rs"

[dependencies]
# MIT/Apache-2.0; GPUI already uses this handle interface.
raw-window-handle = "0.6"
gpui-kit = "0.9.0"
# Already used by gpui-component; MIT. Supplies the host Korean catalog.
rust-i18n = "4.2.4"
pod-terminal-view = { path = "../pod-terminal-view" }
pod-diff = { path = "../pod-diff" }
# Design system (status badges, tree rows, frames) for the P5 orchestration UI.
pod-ui = { path = "../pod-ui" }
pod-status = { path = "../pod-status" }
# P3 editing: file tree, quick open, editor tabs and LSP per task worktree.
pod-editor = { path = "../pod-editor" }
# Client side only: protocol types + blocking client with daemon auto-start.
podd = { path = "../podd", default-features = false }
# P6 PR section fixtures (the fake forge; the app never runs gh itself).
pod-forge = { path = "../pod-forge" }
anyhow = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_IO", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Shell"] }

[lints]
workspace = true

[dev-dependencies]
# Headless GPUI test platform: native-QA interaction tests (keyboard, focus, IME, DPI).
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
tempfile = "3"

[build-dependencies]
# MIT: compiles per-binary Windows resources without leaking through rlibs.
embed-resource = "3.0.12"
