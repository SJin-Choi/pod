[package]
name = "pod-hook"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Agent hook relay: forwards Claude Code / Codex hook events to podd over a named pipe, always prints {} and exits 0"

[[bin]]
name = "pod-hook"
path = "src/main.rs"

[dependencies]
pod-status = { path = "../pod-status" }
serde_json = "1"

# Console: attach to the parent console for `install`/`--help` (pod-hook is a
# GUI-subsystem exe on Windows). The other features are used by the tests.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_Security", "Win32_System_IO", "Win32_System_Threading"] }

[build-dependencies]
# MIT: compiles per-binary Windows resources without leaking through rlibs.
embed-resource = "3.0.12"
