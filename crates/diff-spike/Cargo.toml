[package]
name = "diff-spike"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "P4 risk spike: native GPUI code-review diff view (split/unified, folds, line comments)"

[dependencies]
# Diff model (input layer + full-context patches) and the gpui-kit dependency
# with tree-sitter grammars live in pod-diff, shared with pod-app.
pod-diff = { path = "../pod-diff" }
gpui-kit = "0.9.0"
# MIT/Apache-2.0: line + inline diff
similar = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
